---
# Install mesh instance services (aap-instance-*) and component wrapper services (aap-<node_type>).
#
# Usage:
#   ansible-playbook -i inventory install_aap_service.yml
#   ansible-playbook -i inventory install_aap_service.yml -l exec1.example.com
#
# Runs as root (become). Units are installed under /etc/systemd/system/.
# Component scripts delegate systemctl --user to ansible_user from inventory.

- name: Install AAP Services
  hosts: automationgateway:automationcontroller:automationhub:execution_nodes:automationeda:redis
  become: true

  vars:
    aap_hostname: https://ec2-13-48-35-172.eu-north-1.compute.amazonaws.com
    aap_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          31376538356134313730306237633361643335646163336437353535613739303636343937326461
          3834353166663437306137306665356539386433323237630a663864386336613830316334366561
          66306562366466353232633935343861666361356262623766323333383465326564383664363937
          3865653563336365640a306530623530353463303862666164626163313431323362616233353138
          31643837663262663635376261343136623235316463633361393030613736353763
    aap_validate_certs: false

  tasks:
    - name: Install AAP Services
      ansible.builtin.include_role:
        name: aap_service
        tasks_from: install.yml
