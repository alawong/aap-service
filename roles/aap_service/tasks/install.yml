---
- name: Validate node type is supported
  ansible.builtin.assert:
    that:
      - aap_node_type | length > 0
      - aap_node_type in aap_inventory_group_map.values() | list
    fail_msg: >-
      Could not determine aap_node_type from installer inventory groups
      (automationcontroller, automationgateway, automationhub, execution_nodes,
      automationeda, redis).
      Set aap_node_type on the host or exclude database hosts.

- name: Install mesh instance services
  ansible.builtin.import_tasks: 
    file: mesh.yml
  when: aap_node_type in aap_mesh_node_types

- name: Install component lifecycle script
  ansible.builtin.template:
    src: aap-component.py.j2
    dest: "/usr/local/bin/aap-{{ aap_node_type }}"
    mode: "0755"

- name: Install component systemd unit
  ansible.builtin.template:
    src: aap-component.service.j2
    dest: "/etc/systemd/system/aap-{{ aap_node_type }}.service"
    mode: "0644"

- name: Enable and start component service
  ansible.builtin.systemd:
    name: "aap-{{ aap_node_type }}.service"
    enabled: true
    state: started
    daemon_reload: true
