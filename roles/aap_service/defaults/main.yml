---
aap_instance_hostname: "{{ routable_hostname | default(inventory_hostname) }}"
aap_hostname: "{{ gateway_main_url }}"
aap_validate_certs: true

aap_instance_ready_timeout_seconds: 600
aap_instance_ready_poll_seconds: 15

aap_mesh_node_types:
  - controller
  - execution
  - hybrid

aap_inventory_group_map:
  automationcontroller: controller
  automationgateway: gateway
  automationhub: hub
  execution_nodes: execution
  automationeda: eda
  redis: redis

aap_node_types: >-
  {{
    (['controller'] if 'automationcontroller' in group_names else [])
    + (['gateway'] if 'automationgateway' in group_names else [])
    + (['hub'] if 'automationhub' in group_names else [])
    + (['execution'] if (
        'execution_nodes' in group_names
        or (
          'automationcontroller' in group_names
          and (receptor_type | default('hybrid')) == 'hybrid'
        )
      ) else [])
    + (['eda'] if 'automationeda' in group_names else [])
    + (['redis'] if (
        'redis' in group_names
        or (
          'automationgateway' in group_names
          and (groups['redis'] | default([]) | length == 0)
          and inventory_hostname == (groups['automationgateway'] | first)
        )
      ) else [])
  }}

aap_mesh_instance_type: >-
  {{
    'hybrid' if (
      'automationcontroller' in group_names
      and (receptor_type | default('hybrid')) == 'hybrid'
    )
    else (
      'controller' if 'automationcontroller' in group_names
      else (
        'execution' if 'execution_nodes' in group_names
        else ''
      )
    )
  }}

# Red Hat platform stop order (KCS 7124426); start uses reverse.
aap_manage_order:
  - gateway
  - eda
  - execution
  - controller
  - hub
  - redis

aap_services:
  gateway:
    - redis-unix
    - automation-gateway
    - automation-gateway-proxy
  controller:
    - postgresql
    - redis-unix
    - automation-controller-task
    - automation-controller-web
    - automation-controller-rsyslog
    - receptor
  execution:
    - receptor
  eda:
    - redis-unix
    - automation-eda-scheduler
    - automation-eda-activation-worker-1
    - automation-eda-activation-worker-2
    - automation-eda-worker-1
    - automation-eda-worker-2
    - automation-eda-web
    - automation-eda-daphne
    - automation-eda-api
  hub:
    - redis-unix
    - automation-hub-api
    - automation-hub-content
    - automation-hub-web
    - automation-hub-worker-1
    - automation-hub-worker-2
  redis:
    - redis-tcp

aap_stop_services:
  controller:
    - automation-controller-task
    - automation-controller-web
    - receptor
    - automation-controller-rsyslog
    - redis-unix
    - postgresql
  eda:
    - automation-eda-api
    - automation-eda-daphne
    - automation-eda-web
    - automation-eda-worker-1
    - automation-eda-worker-2
    - automation-eda-activation-worker-1
    - automation-eda-activation-worker-2
    - automation-eda-scheduler
    - redis-unix
  hub:
    - automation-hub-api
    - automation-hub-content
    - automation-hub-web
    - automation-hub-worker-1
    - automation-hub-worker-2
    - redis-unix
  redis:
    - redis-tcp

aap_profiles:
  gateway:
    execution_plane: false
    optional_units:
      - redis-unix
    discover_patterns: []
  controller:
    execution_plane: true
    optional_units:
      - postgresql
      - redis-unix
    discover_patterns: []
  execution:
    execution_plane: true
    optional_units: []
    discover_patterns: []
  eda:
    execution_plane: true
    optional_units:
      - automation-eda-worker-1
      - automation-eda-worker-2
      - automation-eda-activation-worker-1
      - automation-eda-activation-worker-2
      - redis-unix
    discover_patterns:
      - automation-eda-worker-*
      - automation-eda-activation-worker-*
  hub:
    execution_plane: false
    optional_units:
      - redis-unix
    discover_patterns: []
  redis:
    execution_plane: false
    optional_units: []
    discover_patterns: []

aap_skip_units: []
aap_extra_start_units: []
aap_extra_stop_units: []
